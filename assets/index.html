<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge Manager</title>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #8EBAE6;
        --color-background: #EDEFF0;
        --color-card: #D6E4F1;
        --font-display: "Google Sans", sans-serif;
      }
    </style>
  </head>

  <body class="bg-background min-h-screen font-display text-slate-800">
    <header class="bg-card shadow-sm">
      <h1 class="font-bold text-3xl md:text-4xl text-center py-6 tracking-tight">
        DigIn Fresh
      </h1>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 md:py-12">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 items-start">

        <!-- Live Stats -->
        <section class="bg-white rounded-2xl shadow-md p-6 md:p-8">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl md:text-3xl font-bold">Live Stats</h2>
            <span class="rounded-full bg-red-100 text-red-600 font-bold text-lg px-4 py-1">
              4:99
            </span>
          </div>

          <dl class="divide-y divide-slate-100 text-lg md:text-xl">
            <div class="flex justify-between items-center py-4">
              <dt class="text-slate-500">Fruit</dt>
              <dd class="font-bold">Apple</dd>
            </div>
            <div class="flex justify-between items-center py-4">
              <dt class="text-slate-500">Temp</dt>
              <dd class="font-bold">38°F</dd>
            </div>
            <div class="flex justify-between items-center py-4">
              <dt class="text-slate-500">Humidity</dt>
              <dd class="font-bold">32%</dd>
            </div>
            <div class="flex justify-between items-center py-4">
              <dt class="text-slate-500">Condition</dt>
              <dd class="rounded-full bg-lime-100 text-lime-700 font-bold px-4 py-1">
                Fresh
              </dd>
            </div>
          </dl>
        </section>

        <!-- Live View -->
        <section class="bg-white rounded-2xl shadow-md p-6 md:p-8">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl md:text-3xl font-bold">Live View</h2>
          </div>

          <img
            src="/webcam.jpg"
            alt="Live view inside the fridge"
            class="w-full aspect-video object-cover rounded-xl border-4 border-primary bg-slate-100"
          />
        </section>

      </div>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="libs/arduino.js"></script>
    <script src="app.js"></script>
  </body>
</html>
